name: Build and Release Plugin ZIP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin ZIP
        run: |
          mkdir -p dist/ml-carousel-pro
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.distignore' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='dist' \
            ml-carousel-pro/ dist/ml-carousel-pro/
          cd dist
          zip -r ../ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip ml-carousel-pro/
          cd ..
          echo "ZIP created:"
          unzip -l ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip | head -5

      - name: Create GitHub Release and attach ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: "ML Banner Pro v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ML Banner Pro v${{ steps.version.outputs.VERSION }}

            Instale ou atualize pelo painel de plugins do WordPress.

            **Instalação manual:** faça o upload do ZIP em Plugins > Adicionar Novo > Enviar plugin.
          files: ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
