name: Build and Release Plugin ZIP

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="${GITHUB_REF_NAME#v}"; else
            V=$(grep -E '^\s*\*\s*Version:' ml-carousel-pro.php | head -1 | sed -E 's/.*Version:\s*([0-9.]+).*/\1/'); fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT

      - name: Build plugin ZIP
        run: |
          # O plugin fica na RAIZ do repositorio; o ZIP leva a pasta ml-carousel-pro/.
          mkdir -p dist/ml-carousel-pro
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.distignore' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='dist' \
            ./ dist/ml-carousel-pro/
          test -f dist/ml-carousel-pro/ml-carousel-pro.php
          test -f dist/ml-carousel-pro/uninstall.php
          test -f dist/ml-carousel-pro/assets/images/icon-256x256.png
          grep -q "define('MLCP_VERSION',       '${{ steps.version.outputs.VERSION }}')" dist/ml-carousel-pro/ml-carousel-pro.php
          grep -q "Stable tag: ${{ steps.version.outputs.VERSION }}" dist/ml-carousel-pro/readme.txt
          header=$(grep -E '^\s*\*\s*Version:' dist/ml-carousel-pro/ml-carousel-pro.php | head -1 | sed -E 's/.*Version:\s*([0-9.]+).*/\1/')
          if [ "$header" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Tag ${{ steps.version.outputs.VERSION }} difere do Version: $header"; exit 1
          fi
          find dist/ml-carousel-pro -type d -exec chmod 755 {} +
          find dist/ml-carousel-pro -type f -exec chmod 644 {} +
          cd dist
          zip -qrX ../ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip ml-carousel-pro/
          cd ..
          echo "ZIP created:"
          unzip -l ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip | head -5

      - name: ML Release Gate (plugin sozinho, identidade, atualizacao na mesma pasta)
        # Trava obrigatoria: se reprovar, o release NAO e criado e nada chega aos clientes.
        env:
          GATE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'pr' }}
        run: bash .github/gate/gate.sh ml-carousel-pro ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release and attach ZIP
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ML Banner Pro v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ML Banner Pro v${{ steps.version.outputs.VERSION }}

            Instale ou atualize pelo painel de plugins do WordPress.

            **Instalação manual:** faça o upload do ZIP em Plugins > Adicionar Novo > Enviar plugin.
          files: ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
