name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create ZIP
        run: |
          cd ..
          zip -r ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip ml-carousel-pro \
            --exclude "ml-carousel-pro/.git/*" \
            --exclude "ml-carousel-pro/.github/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ML Carousel Pro v${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: ../ml-carousel-pro-v${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
